name: TVMAO & SDGD & SDM EPG

on:
  schedule:
    # 北京时间 02:00 — 三个任务统一运行
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_tvmao:
        description: '运行 TVMAO 抓取'
        required: true
        default: true
        type: boolean
      run_sdgd:
        description: '运行 SDGD 抓取'
        required: true
        default: true
        type: boolean
      run_sdm:
        description: '运行 SDM 抓取'
        required: true
        default: true
        type: boolean

jobs:
  # ============================================================
  #  TVMAO EPG 抓取
  # ============================================================
  tvmao:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_tvmao == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          pip install requests beautifulsoup4 lxml
        fi

    - name: Run TVMAO EPG Crawler
      run: |
        python scripts/tvmao_epg_crawler.py --output EPG --log-dir log

    - name: Upload TVMAO files
      uses: actions/upload-artifact@v4
      with:
        name: epg-tvmao
        path: |
          EPG/tvmao.xml
          EPG/tvmao.xml.gz
          log/tvmao.txt
        retention-days: 3
        if-no-files-found: warn

  # ============================================================
  #  SDGD EPG 抓取
  # ============================================================
  sdgd:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_sdgd == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          pip install requests beautifulsoup4 lxml
        fi

    - name: Run SDGD EPG Crawler
      env:
        SDGD_TOKEN: ${{ secrets.SDGD_TOKEN }}
        SDGD_APP_ID: ${{ secrets.SDGD_APP_ID }}
      run: |
        python scripts/fetch_epg_sdgd.py

    - name: Upload SDGD files
      uses: actions/upload-artifact@v4
      with:
        name: epg-sdgd
        path: EPG/sdgd.xml.gz
        retention-days: 3
        if-no-files-found: warn

  # ============================================================
  #  SDM EPG 抓取 (山东移动)
  # ============================================================
  sdm:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_sdm == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout public repository (SD-EPG)
      uses: actions/checkout@v4
      with:
        path: public_repo
        fetch-depth: 0

    - name: Checkout private repository (SDU-IPTV-NEW)
      uses: actions/checkout@v4
      with:
        repository: sggc/SDU-IPTV-NEW
        path: private_repo
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0
        clean: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Run SDM EPG fetcher
      run: |
        cd public_repo
        python ../private_repo/SD-EPG/scripts/fetch_sdm_epg.py \
          --output ./EPG/sdm.xml.gz

    - name: Upload SDM files
      uses: actions/upload-artifact@v4
      with:
        name: epg-sdm
        path: public_repo/EPG/sdm.xml.gz
        retention-days: 3
        if-no-files-found: warn

  # ============================================================
  #  汇总提交 — 下载所有成功的 artifact，统一提交推送
  #  即使某个抓取 Job 失败，成功的依然会提交
  # ============================================================
  commit:
    needs: [tvmao, sdgd, sdm]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Download TVMAO artifact
      if: ${{ needs.tvmao.result == 'success' }}
      uses: actions/download-artifact@v4
      with:
        name: epg-tvmao
        path: tmp-tvmao

    - name: Download SDGD artifact
      if: ${{ needs.sdgd.result == 'success' }}
      uses: actions/download-artifact@v4
      with:
        name: epg-sdgd
        path: tmp-sdgd

    - name: Download SDM artifact
      if: ${{ needs.sdm.result == 'success' }}
      uses: actions/download-artifact@v4
      with:
        name: epg-sdm
        path: tmp-sdm

    - name: Merge artifacts into EPG directory
      run: |
        mkdir -p EPG log

        # TVMAO
        if [ -d tmp-tvmao ]; then
          cp -f tmp-tvmao/EPG/tvmao.xml EPG/ 2>/dev/null || true
          cp -f tmp-tvmao/EPG/tvmao.xml.gz EPG/ 2>/dev/null || true
          cp -f tmp-tvmao/log/tvmao.txt log/ 2>/dev/null || true
          echo "TVMAO: 已合并"
        else
          echo "TVMAO: 无数据（抓取失败或跳过）"
        fi

        # SDGD
        if [ -d tmp-sdgd ]; then
          cp -f tmp-sdgd/sdgd.xml.gz EPG/ 2>/dev/null || true
          echo "SDGD: 已合并"
        else
          echo "SDGD: 无数据（抓取失败或跳过）"
        fi

        # SDM
        if [ -d tmp-sdm ]; then
          cp -f tmp-sdm/sdm.xml.gz EPG/ 2>/dev/null || true
          echo "SDM: 已合并"
        else
          echo "SDM: 无数据（抓取失败或跳过）"
        fi

    - name: Display results
      run: |
        echo "=== 任务结果 ==="
        echo "TVMAO: ${{ needs.tvmao.result }}"
        echo "SDGD:  ${{ needs.sdgd.result }}"
        echo "SDM:   ${{ needs.sdm.result }}"
        echo ""
        echo "=== EPG 目录 ==="
        ls -lh EPG/

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add EPG/tvmao.xml EPG/tvmao.xml.gz EPG/sdgd.xml.gz EPG/sdm.xml.gz log/tvmao.txt 2>/dev/null || true

        if ! git diff --cached --quiet; then
          git commit -m "EPG 更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S') [TVMAO:${{ needs.tvmao.result }} SDGD:${{ needs.sdgd.result }} SDM:${{ needs.sdm.result }}]"
          git fetch origin ${{ github.ref_name }}
          if ! git rebase origin/${{ github.ref_name }} -X theirs; then
            echo "::warning::Rebase failed, falling back to reset+recommit"
            git rebase --abort
            git reset --soft origin/${{ github.ref_name }}
            git add EPG/tvmao.xml EPG/tvmao.xml.gz EPG/sdgd.xml.gz EPG/sdm.xml.gz log/tvmao.txt 2>/dev/null || true
            git commit -m "EPG 更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S') [TVMAO:${{ needs.tvmao.result }} SDGD:${{ needs.sdgd.result }} SDM:${{ needs.sdm.result }}]"
          fi
          git push
          echo "EPG 已成功提交并推送"
        else
          echo "无 EPG 变更，跳过提交"
        fi
