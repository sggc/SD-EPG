name: TVMAO & SDGD & SDM EPG

on:
  schedule:
    - cron: '0 18 * * *'  # 北京时间 02:00
  workflow_dispatch:
    inputs:
      run_tvmao:
        description: '运行 TVMAO 抓取'
        required: true
        default: true
        type: boolean
      run_sdgd:
        description: '运行 SDGD 抓取'
        required: true
        default: true
        type: boolean
      run_sdm:
        description: '运行 SDM 抓取'
        required: true
        default: true
        type: boolean

jobs:
  tvmao:
    if: github.event_name == 'schedule' || inputs.run_tvmao
    runs-on: ubuntu-latest
    steps:
    - name: Checkout public repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          pip install requests beautifulsoup4 lxml
        fi

    - name: Run TVMAO EPG Crawler
      run: |
        python scripts/tvmao_epg_crawler.py --output EPG --log-dir log

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add EPG/tvmao.xml EPG/tvmao.xml.gz log/tvmao.txt

        if ! git diff --cached --quiet; then
          git commit -m "TVMAO EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          git fetch origin ${{ github.ref_name }}
          if ! git rebase origin/${{ github.ref_name }} -X theirs; then
            echo "::warning::Rebase failed, falling back to reset+recommit"
            git rebase --abort
            git reset --soft origin/${{ github.ref_name }}
            git add EPG/tvmao.xml EPG/tvmao.xml.gz log/tvmao.txt
            git commit -m "TVMAO EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          fi
          git push
          echo "TVMAO EPG 已成功提交并推送"
        else
          echo "无 TVMAO 变更，跳过提交"
        fi

  sdgd:
    if: github.event_name == 'schedule' || inputs.run_sdgd
    runs-on: ubuntu-latest
    steps:
    - name: Checkout public repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        else
          pip install requests beautifulsoup4 lxml
        fi

    - name: Run SDGD EPG Crawler
      env:
        SDGD_TOKEN: ${{ secrets.SDGD_TOKEN }}
        SDGD_APP_ID: ${{ secrets.SDGD_APP_ID }}
      run: |
        python scripts/fetch_epg_sdgd.py

    - name: Commit and push
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add EPG/sdgd.xml.gz

        if ! git diff --cached --quiet; then
          git commit -m "SDGD EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          git fetch origin ${{ github.ref_name }}
          if ! git rebase origin/${{ github.ref_name }} -X theirs; then
            echo "::warning::Rebase failed, falling back to reset+recommit"
            git rebase --abort
            git reset --soft origin/${{ github.ref_name }}
            git add EPG/sdgd.xml.gz
            git commit -m "SDGD EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          fi
          git push
          echo "SDGD EPG 已成功提交并推送"
        else
          echo "无 SDGD 变更，跳过提交"
        fi

  sdm:
    if: github.event_name == 'schedule' || inputs.run_sdm
    runs-on: ubuntu-latest
    steps:
    - name: Checkout public repository (SD-EPG)
      uses: actions/checkout@v4
      with:
        path: public_repo
        fetch-depth: 0

    - name: Checkout private repository (SDU-IPTV-NEW)
      uses: actions/checkout@v4
      with:
        repository: sggc/SDU-IPTV-NEW
        path: private_repo
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0
        clean: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Configure git
      run: |
        cd public_repo
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

    - name: Run SDM EPG fetcher
      run: |
        cd public_repo
        python ../private_repo/SD-EPG/scripts/fetch_sdm_epg.py \
          --output ./EPG/sdm.xml.gz

    - name: Commit and push
      run: |
        cd public_repo
        git add EPG/sdm.xml.gz

        if ! git diff --cached --quiet; then
          git commit -m "山东移动EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          git fetch origin ${{ github.ref_name }}
          if ! git rebase origin/${{ github.ref_name }} -X theirs; then
            echo "::warning::Rebase failed, falling back to reset+recommit"
            git rebase --abort
            git reset --soft origin/${{ github.ref_name }}
            git add EPG/sdm.xml.gz
            git commit -m "山东移动EPG $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          fi
          git push
          echo "SDM EPG 已成功提交并推送"
        else
          echo "无 SDM 变更，跳过提交"
        fi
