<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD-EPG 仪表盘</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <h1 class="title">SD-EPG 仪表盘</h1>
                    <p class="subtitle">EPG 聚合与 Desc 注入数据监控</p>
                </div>
                <div class="header-right">
                    <div class="meta-item">
                        <span class="meta-label">更新时间</span>
                        <span class="meta-value" id="updateTime">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">数据范围</span>
                        <span class="meta-value" id="dateRange">--</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="section" id="overviewSection">
                <h2 class="section-title">总体概览</h2>
                <div class="stat-grid" id="statGrid">
                    <div class="stat-card">
                        <div class="stat-value" id="statChannels">--</div>
                        <div class="stat-label">白名单频道</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statMatched">--</div>
                        <div class="stat-label">已匹配频道</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statPrograms">--</div>
                        <div class="stat-label">总节目数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statFiltered">--</div>
                        <div class="stat-label">已过滤节目</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statDescChannels">--</div>
                        <div class="stat-label">有描述频道</div>
                    </div>
                    <div class="stat-card highlight">
                        <div class="stat-value" id="statMatchRate">--</div>
                        <div class="stat-label">描述匹配率</div>
                    </div>
                </div>
            </section>

            <section class="section" id="sourcesSection">
                <h2 class="section-title">数据源统计</h2>
                <div class="table-wrapper">
                    <table class="data-table" id="sourceTable">
                        <thead>
                            <tr>
                                <th>数据源</th>
                                <th>状态</th>
                                <th class="num">频道数</th>
                                <th class="num">节目数</th>
                                <th class="num">已匹配</th>
                            </tr>
                        </thead>
                        <tbody id="sourceTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section class="section" id="channelsSection">
                <h2 class="section-title">
                    频道列表
                    <span class="count-badge" id="channelCount">0</span>
                </h2>
                <div class="toolbar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索频道名称或 tvg-id...">
                    <select class="sort-select" id="sortSelect">
                        <option value="name">按名称排序</option>
                        <option value="matchRate">按匹配率排序</option>
                        <option value="programCount">按节目数排序</option>
                        <option value="todayCount">按今日节目数排序</option>
                    </select>
                    <label class="filter-label">
                        <input type="checkbox" id="filterLowMatch">
                        仅显示低匹配率 (&lt;50%)
                    </label>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="channelTable">
                        <thead>
                            <tr>
                                <th>频道名称</th>
                                <th>tvg-id</th>
                                <th>数据源</th>
                                <th class="num">节目总数</th>
                                <th class="num">今日节目</th>
                                <th class="num">需匹配</th>
                                <th class="num">已匹配</th>
                                <th class="num">匹配率</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="channelTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </section>
        </main>

        <footer class="footer">
            <span>SD-EPG Dashboard (Plan B)</span>
            <span class="footer-sep">·</span>
            <a href="../dashboard-old/" class="footer-link">旧版仪表盘</a>
            <span class="footer-sep">·</span>
            <a href="https://github.com/sggc/SD-EPG" class="footer-link" target="_blank">GitHub</a>
        </footer>
    </div>

    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>正在加载数据...</p>
    </div>

    <div class="error" id="error" style="display:none">
        <p id="errorMsg"></p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
